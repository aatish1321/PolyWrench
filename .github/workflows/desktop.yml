name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm run check
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
      - if: runner.os != 'Linux'
        run: npm run test:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostics-${{ runner.os }}-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: ignore
      - run: npx electron-builder --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PolyWrench-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            artifacts/*.json
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: PolyWrench-*
          path: packages
          merge-multiple: true
      - name: Verify all installers and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cd packages/release
          installers=(
            "PolyWrench-${version}-linux-x86_64.AppImage"
            "PolyWrench-${version}-linux-amd64.deb"
            "PolyWrench-${version}-win-x64.exe"
            "PolyWrench-${version}-mac-x64.dmg"
            "PolyWrench-${version}-mac-arm64.dmg"
          )
          for installer in "${installers[@]}"; do
            test -s "$installer"
          done
          sha256sum "${installers[@]}" > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Offline desktop toolkit with the Peach & Teal interface, Google Sans, frosted panels and animations.

            Download the installer for your platform below: Windows x64 (.exe), macOS Intel/Apple Silicon (.dmg), or Linux x64 (.deb/AppImage). SHA256SUMS.txt contains checksums for all five packages.

            Installation and upgrade instructions: https://github.com/aatish1321/PolyWrench#install-or-update-polywrench

            Windows/macOS builds are not signed or notarized. Optional engines and models are downloaded separately through Offline Setup.
          files: |
            packages/release/*.AppImage
            packages/release/*.deb
            packages/release/*.exe
            packages/release/*.dmg
            packages/release/SHA256SUMS.txt
      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
