name: Desktop checks and packages
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x64
          - os: windows-latest
            arch: x64
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx install-electron --no
      - run: npm run check
      - run: npm run build
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:smoke
      - if: runner.os != 'Linux'
        run: npm run test:smoke
      - run: npx electron-builder --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: PolyWrench-${{ runner.os }}-${{ matrix.arch }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.dmg
            artifacts/*.json
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            packages/*.AppImage
            packages/*.deb
            packages/*.exe
            packages/*.dmg
